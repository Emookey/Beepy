services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mbc_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:-mbc_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-mbc_intelligence}
      OLLAMA_URL: ${OLLAMA_URL:?OLLAMA_URL must be set}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./secrets/odysseus.token:/run/secrets/odysseus.token:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9080:9080"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9080", "--workers", "2"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-mbc_intelligence}
      OLLAMA_URL: ${OLLAMA_URL:?OLLAMA_URL must be set}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

volumes:
  postgres_data:
